<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
        fill: #17324d;
      }
      .label { font-size: 34px; font-weight: 700; }
      .small { font-size: 26px; fill: #4f6679; }
      .box { fill: #ffffff; stroke: #256fae; stroke-width: 4; }
      .data-line { fill: none; stroke: #256fae; stroke-width: 4; }
      .control-line { fill: none; stroke: #d86936; stroke-width: 4; }
      .network-line { fill: none; stroke: #47677f; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
            refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#256fae"/>
    </marker>
    <marker id="arrowOrange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
            refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d86936"/>
    </marker>
    <marker id="arrowGray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10"
            refX="8.5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#47677f"/>
    </marker>
  </defs>

  <rect width="1800" height="620" fill="#fbfdff"/>

  <!-- 传感器 -->
  <g filter="url(#shadow)">
    <path d="M95 306 L285 306 L265 376 L75 376 Z" class="box"/>
    <text x="180" y="350" text-anchor="middle" class="label">传感器 1</text>

    <path d="M95 416 L285 416 L265 486 L75 486 Z" class="box"/>
    <text x="180" y="460" text-anchor="middle" class="label">传感器 2</text>
  </g>

  <!-- 执行器 -->
  <g filter="url(#shadow)">
    <path d="M326 145 L486 145 L470 213 L310 213 Z" class="box"/>
    <text x="398" y="187" text-anchor="middle" class="label">执行器 1</text>

    <path d="M506 145 L666 145 L650 213 L490 213 Z" class="box"/>
    <text x="578" y="187" text-anchor="middle" class="label">执行器 2</text>
  </g>

  <!-- 智能终端与 IoT 模块 -->
  <g filter="url(#shadow)">
    <rect x="350" y="330" width="260" height="120" rx="8" class="box"/>
    <text x="480" y="382" text-anchor="middle" class="label">智能终端</text>
    <text x="480" y="418" text-anchor="middle" class="small">采集、处理与控制</text>

    <rect x="710" y="330" width="210" height="120" rx="8" class="box"/>
    <text x="815" y="382" text-anchor="middle" class="label">IoT 模块</text>
    <text x="815" y="418" text-anchor="middle" class="small">网络通信</text>
  </g>

  <!-- 无线路由器 -->
  <g filter="url(#shadow)">
    <rect x="1010" y="330" width="230" height="120" rx="25" class="box"/>
    <text x="1125" y="382" text-anchor="middle" class="label">无线路由器</text>
    <path d="M1085 420 Q1125 385 1165 420 M1100 430 Q1125 408 1150 430"
          fill="none" stroke="#256fae" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1125" cy="439" r="5" fill="#256fae"/>
  </g>

  <!-- Web 服务器与数据库 -->
  <g filter="url(#shadow)">
    <rect x="1010" y="185" width="230" height="82" rx="15" class="box"/>
    <text x="1125" y="236" text-anchor="middle" class="label">Web 服务器</text>

    <ellipse cx="1125" cy="67" rx="92" ry="25" class="box"/>
    <rect x="1033" y="67" width="184" height="67" fill="#ffffff" stroke="#256fae" stroke-width="4"/>
    <path d="M1033 134 A92 25 0 0 0 1217 134" fill="#ffffff" stroke="#256fae" stroke-width="4"/>
    <text x="1125" y="108" text-anchor="middle" class="label">数据库</text>
  </g>

  <!-- 互联网 -->
  <g filter="url(#shadow)">
    <path d="M1310 337
             C1328 305 1365 299 1392 315
             C1412 280 1470 284 1483 324
             C1525 318 1547 350 1536 382
             C1565 404 1546 449 1507 449
             L1340 449
             C1305 449 1288 421 1299 397
             C1272 380 1283 345 1310 337 Z"
          fill="#ffffff" stroke="#256fae" stroke-width="4"/>
    <text x="1418" y="389" text-anchor="middle" class="label">互联网</text>
  </g>

  <!-- 浏览器 -->
  <g filter="url(#shadow)">
    <path d="M1600 295 L1760 295 L1744 363 L1584 363 Z" class="box"/>
    <text x="1672" y="337" text-anchor="middle" class="label">浏览器 1</text>

    <path d="M1600 413 L1760 413 L1744 481 L1584 481 Z" class="box"/>
    <text x="1672" y="455" text-anchor="middle" class="label">浏览器 2</text>
  </g>

  <!-- 传感器数据进入智能终端 -->
  <path d="M270 341 H318 Q335 341 350 356" class="data-line" marker-end="url(#arrowBlue)"/>
  <path d="M270 451 H318 Q335 451 350 425" class="data-line" marker-end="url(#arrowBlue)"/>

  <!-- 智能终端向执行器发送控制信号 -->
  <path d="M420 330 V250 Q420 228 405 217" class="control-line" marker-end="url(#arrowOrange)"/>
  <path d="M540 330 V250 Q540 228 575 217" class="control-line" marker-end="url(#arrowOrange)"/>

  <!-- 主通信链路 -->
  <path d="M610 390 H705" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <path d="M920 390 H1005" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <path d="M1240 390 H1295" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>

  <!-- 服务器与数据库 -->
  <path d="M1125 330 V272" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <path d="M1125 185 V139" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>

  <!-- 互联网与浏览器 -->
  <path d="M1539 359 H1570 Q1582 359 1592 342" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <path d="M1538 416 H1570 Q1582 416 1592 434" class="network-line"
        marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>

</svg>
